# rustfmt on every push and pull request: the psx workspace and the game
# template (rustfmt.toml in each: 120 columns). Fix with `cargo fmt --all`
# at the root and in templates/base; the add-ons (templates/addons) are checked
# in a workspace with them added (release.yml).
name: Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path templates/base/Cargo.toml
