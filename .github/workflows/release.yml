# Builds psx for each platform and publishes a GitHub Release when a version
# tag is pushed:
#
#   1. set [workspace.package] version in Cargo.toml, e.g. 0.2.0, and commit
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# Assets are psx-<target>.tar.gz (psx-<target>.zip on Windows), each with a
# .sha256, plus SHA256SUMS. Names carry no version, so
# releases/latest/download/<asset> always points at the newest release; the
# install.sh and install.ps1 installers rely on that.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish again, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported runners so the glibc requirement stays low (2.35).
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The template, guide and parser files are embedded with include_str!;
      # keep their LF endings on Windows so every build writes the same files.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --profile dist --locked -p psx --target ${{ matrix.target }}
      - name: Package
        run: |
          name=psx-${{ matrix.target }}
          mkdir -p dist/stage
          cp README.md LICENSE-MIT LICENSE-APACHE dist/stage/
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/${{ matrix.target }}/dist/psx.exe dist/stage/
            asset=$name.zip
            (cd dist/stage && 7z a -tzip "../$asset" . > /dev/null)
          else
            cp target/${{ matrix.target }}/dist/psx dist/stage/
            asset=$name.tar.gz
            tar -czf "dist/$asset" -C dist/stage .
          fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          cat "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: psx-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
          else
            gh release create "$TAG" * --verify-tag --title "psx $TAG" --generate-notes
          fi
