# Importers: the player's disc -> the port's asset formats. A library the game
# runs on first start (game/src/disc.rs) and a command for running it by
# hand. The original's raw formats live only here. No Bevy: it stays quick to
# build and test.
[package]
name = "import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
psx-media.workspace = true
psx-assets.workspace = true
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
