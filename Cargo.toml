[workspace]
resolver = "2"
members = [
    "crates/psx",
    "crates/psx-core",
    "crates/psx-gpu",
    "crates/psx-assets",
    "crates/psx-gte",
    "crates/psx-media",
    "crates/psx-oracle",
    "crates/psx-redux",
    "crates/psx-symbols",
]

[workspace.package]
version = "0.3.5"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
psx-core = { path = "crates/psx-core" }
psx-assets = { path = "crates/psx-assets" }
psx-gpu = { path = "crates/psx-gpu" }
psx-gte = { path = "crates/psx-gte" }
psx-media = { path = "crates/psx-media" }
psx-redux = { path = "crates/psx-redux" }
psx-symbols = { path = "crates/psx-symbols" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
schemars = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

# Captures hash and encode tens of MB per run; unoptimised builds dominate run time.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release downloads (`cargo build --profile dist`): no debug info, symbols stripped.
[profile.dist]
inherits = "release"
debug = 0
strip = true
