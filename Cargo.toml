[workspace]
resolver = "2"
members = [
    "crates/psx",
    "crates/psx-media",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
psx-media = { path = "crates/psx-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
schemars = "1"

[profile.release]
opt-level = 3
lto = "thin"
debug = 1
