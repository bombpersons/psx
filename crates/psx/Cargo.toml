[package]
name = "psx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PlayStation reverse-engineering toolkit CLI"

[dependencies]
psx-media = { workspace = true }
psx-assets = { workspace = true }
psx-core = { workspace = true }
psx-gpu = { workspace = true }
psx-symbols = { workspace = true }
png = "0.18"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
schemars = { workspace = true }
rmcp = { version = "=3.5.1", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.23"
sha2 = { workspace = true }
minifb = { version = "0.29", optional = true }
gilrs = { version = "0.11", optional = true }
font8x8 = { version = "0.3", optional = true }
cpal = { version = "0.17", optional = true }

[build-dependencies]
sha2 = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["window"]
# `psx handoff`: a window a person plays in (keyboard and gamepads), with
# sound. Build with --no-default-features for a headless binary.
window = ["dep:minifb", "dep:gilrs", "dep:font8x8", "dep:cpal"]
