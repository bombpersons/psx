<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>psx web</title>
<script>try { const t = localStorage.getItem("psx-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --dim: #6b6b66; --line: #e2e1dc;
  --accent: #2f6fdb; --port: #e07a1f; --act: #c6362f; --warn: #b7791f; --info: #4a7a5c; --ok: #2e8b57;
  --chip: #efeee9; --sel: #e8f0fd; --violet: #8a5cd0; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* The charts' own series colours, apart from the status colours above:
     neighbours in a stack stay apart for colour-blind eyes too (checked
     per theme against its panel), no pair under CIEDE2000 21.
     st0 is the stage before any colour. lane-l: the lightness of the
     features' own hues in "Features over time". */
  --st0: #a3a29c; --st1: #2a78d6; --st2: #ec93bf; --st3: #eda100; --st4: #b128bd; --st5: #1baf7a; --lane-l: 42%;
}
/* Themes: the system's light or dark unless one is picked (data-theme). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #151515; --panel: #1e1e1e; --ink: #e8e8e4; --dim: #9a9a94; --line: #2f2f2d;
    --accent: #6ea0ff; --port: #f0a050; --act: #ff6b61; --warn: #e3b04b; --info: #79b591; --ok: #5cc28a;
    --chip: #2a2a28; --sel: #23324a; --violet: #a888e8;
    --st0: #6b6b66; --st1: #3987e5; --st2: #dd3cc2; --st3: #c98500; --st4: #d9c3ff; --st5: #199e70; --lane-l: 62%;
  }
}
:root[data-theme=dark] {
  --bg: #151515; --panel: #1e1e1e; --ink: #e8e8e4; --dim: #9a9a94; --line: #2f2f2d;
  --accent: #6ea0ff; --port: #f0a050; --act: #ff6b61; --warn: #e3b04b; --info: #79b591; --ok: #5cc28a;
  --chip: #2a2a28; --sel: #23324a; --violet: #a888e8;
  --st0: #6b6b66; --st1: #3987e5; --st2: #dd3cc2; --st3: #c98500; --st4: #d9c3ff; --st5: #199e70; --lane-l: 62%;
  color-scheme: dark;
}
:root[data-theme=light] { color-scheme: light; }
/* PlayStation: the boot screen's deep blue, the pad's four buttons for
   colour (triangle green, circle red, cross blue, square pink). */
:root[data-theme=ps] {
  --bg: #0a0d26; --panel: #13183a; --ink: #e7e9f7; --dim: #8e94c4; --line: #262c5c;
  --accent: #6f9cf0; --port: #f0a050; --act: #f0525a; --warn: #e8c15a; --info: #e58fd0; --ok: #41c49a;
  --chip: #1d2350; --sel: #232c6a; --violet: #e58fd0;
  --st0: #75787f; --st1: #3987e5; --st2: #dd3cc2; --st3: #c98500; --st4: #d9c3ff; --st5: #199e70; --lane-l: 62%;
  color-scheme: dark;
}
:root[data-theme=ps] body { background: radial-gradient(ellipse at top, #18205a 0%, var(--bg) 60%) fixed; }
:root[data-theme=ps] header { border-bottom: 0; box-shadow: 0 1px 0 var(--line); background: linear-gradient(90deg, #13183a, #1a2150); }
:root[data-theme=ps] header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: linear-gradient(90deg, #41c49a 0 25%, #f0525a 25% 50%, #6f9cf0 50% 75%, #e58fd0 75%); }
:root[data-theme=ps] header h1::after { content: " △◯✕□"; font-size: 12px; letter-spacing: .25em; background: linear-gradient(90deg, #41c49a 0 25%, #f0525a 25% 50%, #6f9cf0 50% 75%, #e58fd0 75%); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-theme=ps] .card, :root[data-theme=ps] .call { box-shadow: 0 2px 10px rgba(0,0,0,.35); }
:root[data-theme=ps] .card h2 { color: var(--accent); letter-spacing: .12em; }
#theme { font: inherit; font-size: 12px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; height: var(--hd); }
:root { --hd: 42px; --side: 250px; --chatw: 380px; }
/* The page: projects on the left, the view in the middle, on the log the
   messages on the right. A desktop page. */
#shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr) auto; align-items: start; }
#side { position: sticky; top: var(--hd); height: calc(100vh - var(--hd)); overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 10px 8px; }
#side .sh { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 12px 8px 4px; font-weight: 600; }
.proj { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; margin-bottom: 2px; cursor: pointer; }
.proj:hover { background: var(--chip); }
.proj.on { background: var(--sel); border-color: var(--line); }
.proj .pn { display: flex; align-items: center; gap: 7px; }
.proj .pn b { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .pi { font-size: 12px; color: var(--dim); margin: 2px 0 0 15px; }
.proj .pa { font-size: 12px; margin: 3px 0 0 15px; padding-left: 6px; border-left: 2px solid var(--line); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.proj .pa:hover { color: var(--accent); }
.proj .pa.act { border-left-color: var(--act); } .proj .pa.warn { border-left-color: var(--warn); }
.proj .n, .proj .mail { font-size: 11px; background: var(--act); color: #fff; border-radius: 9px; padding: 0 6px; }
.proj .n:empty { display: none; }
header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .02em; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid transparent; background: none; color: var(--ink); padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { background: var(--chip); }
.tab.on { background: var(--sel); border-color: var(--line); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
.dot.act { background: var(--act); } .dot.warn { background: var(--warn); } .dot.info { background: var(--info); }
#live { margin-left: auto; color: var(--dim); font-size: 12px; }
.chip { background: var(--chip); border-radius: 6px; padding: 3px 9px; font-size: 13px; cursor: pointer; border-left: 3px solid var(--line); max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.act { border-left-color: var(--act); } .chip.warn { border-left-color: var(--warn); } .chip.info { border-left-color: var(--info); }
.chip b { font-weight: 600; }
.quiet { color: var(--dim); font-size: 13px; }
main { padding: 12px 20px 40px; min-width: 0; }
nav.sub { display: flex; gap: 4px; margin-bottom: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.next .item { font-size: 18px; font-weight: 600; }
.tab .mail { font-size: 11px; background: var(--act); color: #fff; border-radius: 9px; padding: 0 5px; }
.who { font-size: 12px; padding: 1px 7px; border-radius: 10px; background: var(--chip); margin-left: 6px; vertical-align: middle; }
.who.person { background: var(--act); color: #fff; }
details summary { cursor: pointer; color: var(--dim); margin-top: 6px; }
.att { padding: 6px 0 6px 10px; border-left: 3px solid var(--line); margin: 4px 0; }
.att.act { border-left-color: var(--act); } .att.warn { border-left-color: var(--warn); } .att.info { border-left-color: var(--info); }
.att .d { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
.tiles { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.tile { background: var(--chip); border-radius: 6px; padding: 6px 10px; min-width: 110px; }
.tile .n { font-size: 18px; font-weight: 600; } .tile .l { font-size: 12px; color: var(--dim); }
canvas.chart { width: 100%; height: 130px; display: block; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--dim); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--ok); }
/* log */
.filters { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.filters input[type=text], .filters select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
.filters input[type=text] { min-width: 220px; }
.feed { max-width: 1600px; margin: 0 auto; }
/* The log scrolls in its own box, so the header and filters stay in view. */
body.logv main { padding-bottom: 0; }
.feedbox { overflow-y: auto; overflow-anchor: none; overscroll-behavior: contain; border-top: 1px solid var(--line); padding: 0 6px 12px 0; }
.grp { display: flex; gap: 10px; align-items: center; margin: 18px 0 6px; }
.grp .av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; flex: none; }
.grp .nm { font-weight: 600; } .grp .m { color: var(--dim); font-size: 12px; }
.call { --fam: var(--line); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--fam); border-radius: 8px; margin: 0 0 8px 40px; min-width: 0; }
.call[data-fam=disc] { --fam: var(--info); } .call[data-fam=code] { --fam: var(--accent); } .call[data-fam=emu] { --fam: var(--port); }
.call[data-fam=scenario] { --fam: var(--violet); } .call[data-fam=port] { --fam: var(--ok); } .call[data-fam=talk] { --fam: var(--accent); }
.call.err { --fam: var(--act); background: color-mix(in srgb, var(--act) 5%, var(--panel)); }
.call > .ch { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; min-width: 0; }
.call .lab { font-weight: 600; white-space: nowrap; }
.call .tn { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; }
.call .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.call .m { color: var(--dim); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.call > .cb { padding: 0 10px 10px; font-size: 13px; min-width: 0; }
.call > .cb:empty { display: none; }
.call .raw > summary { font-size: 12px; margin-top: 8px; }
.call .raw pre { max-height: 360px; overflow: auto; background: var(--bg); padding: 6px; border-radius: 6px; margin-top: 4px; }
.call .lead { margin-bottom: 6px; }
.call .note { color: var(--dim); font-size: 12px; margin-top: 4px; }
.call .text { white-space: pre-wrap; }
.call h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 10px 0 4px; font-weight: 600; }
.badge { font-size: 11px; padding: 0 5px; border-radius: 4px; background: var(--chip); white-space: nowrap; }
.badge.rep { background: var(--act); color: #fff; } .badge.big { background: var(--warn); color: #000; } .badge.run { background: var(--accent); color: #fff; }
.more { padding: 6px 0; color: var(--accent); cursor: pointer; font-size: 13px; text-align: center; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; font-size: 13px; }
.kv > :nth-child(odd) { color: var(--dim); }
.kv > :nth-child(even) { min-width: 0; overflow-wrap: anywhere; }
.pill { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 10px; background: var(--chip); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 22%, transparent); } .pill.bad { background: color-mix(in srgb, var(--act) 22%, transparent); }
.pill.warn { background: color-mix(in srgb, var(--warn) 25%, transparent); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 6px; }
.stat { background: var(--chip); border-radius: 6px; padding: 3px 9px; }
.stat b { font-size: 15px; font-variant-numeric: tabular-nums; } .stat span { color: var(--dim); font-size: 12px; margin-left: 4px; }
.stat .bar { margin-top: 3px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.stat .bar i { display: block; height: 100%; background: var(--ok); }
.scroll { max-height: 320px; overflow: auto; }
.tbl { font-size: 12px; }
.tbl td, .tbl th { padding: 2px 8px; }
.tbl td { font-variant-numeric: tabular-nums; }
.tbl tr.hot td { background: color-mix(in srgb, var(--warn) 14%, transparent); }
.tbl td.ch { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.code { font-family: var(--mono); font-size: 12px; background: var(--bg); border-radius: 6px; padding: 6px 8px; overflow: auto; max-height: 420px; white-space: pre; tab-size: 4; }
.code .ad { color: var(--dim); } .code .wd { color: var(--dim); opacity: .6; } .code .mn { color: var(--accent); font-weight: 600; }
.code .rg { color: var(--port); } .code .nu { color: var(--ok); } .code .lb { color: var(--violet); font-weight: 600; } .code .cm { color: var(--dim); font-style: italic; }
.code .kw { color: var(--accent); font-weight: 600; } .code .ty { color: var(--violet); } .code .fn { color: var(--port); } .code .st { color: var(--ok); }
.code .df { background: color-mix(in srgb, var(--warn) 25%, transparent); }
.shots { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
.shot { margin: 0; }
.shot img { display: block; max-width: 100%; width: 320px; image-rendering: pixelated; border-radius: 6px; background: #000; cursor: zoom-in; }
.shot.small img { width: 160px; } .shot.tex { width: 112px; } .shot.tex figcaption { font-size: 10px; } .shot.tex img { width: auto; max-width: 128px; max-height: 128px; background: repeating-conic-gradient(var(--chip) 0 25%, var(--panel) 0 50%) 0 0 / 12px 12px; }
.shot figcaption { font-size: 11px; color: var(--dim); max-width: 320px; overflow-wrap: anywhere; }
.footage { margin-top: 6px; }
.footage .screen { width: 384px; }
.md h3 { font-size: 13px; margin: 10px 0 4px; } .md p { margin: 4px 0; } .md code { font-family: var(--mono); font-size: 12px; background: var(--chip); padding: 0 3px; border-radius: 3px; }
.md .code { max-height: none; }
.fold { position: relative; max-height: 220px; overflow: hidden; }
.fold.open { max-height: none; }
.fold:not(.open)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, var(--panel)); }
.unfold { color: var(--accent); cursor: pointer; font-size: 12px; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: flex; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
#zoom img { max-width: 95vw; max-height: 95vh; image-rendering: pixelated; min-width: min(90vw, 1024px); object-fit: contain; }
/* messages */
/* The messages: a column of the page, right of the view; folded, a strip. */
#chat { position: sticky; top: var(--hd); width: var(--chatw); height: calc(100vh - var(--hd)); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
#chat[hidden] { display: none; }
#chat.min { width: 44px; }
#chat.min .hd { flex-direction: column; height: 100%; padding: 12px 0; }
#chat.min .hd b { writing-mode: vertical-rl; flex: none; }
#chat.min #chatwho { display: none; }
#chat.min .body, #chat.min .compose { display: none; }
#chat .hd { padding: 8px 12px; display: flex; gap: 8px; align-items: center; cursor: pointer; user-select: none; }
#chat:not(.min) .hd { border-bottom: 1px solid var(--line); }
#chat .hd b { flex: 1; } #chat .hd .n { background: var(--act); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 12px; }
#chat .hd .n:empty { display: none; }
#chat .body { overflow: auto; padding: 8px 10px; flex: 1; min-height: 80px; }
#chat .thr { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
#chat .msg { padding: 5px 9px; font-size: 13px; }
#chat .msg .w { font-size: 11px; color: var(--dim); display: flex; gap: 6px; }
#chat .msg .w b { color: var(--ink); }
#chat .msg.agent .w b { color: var(--accent); }
#chat .msg.new { background: color-mix(in srgb, var(--accent) 8%, transparent); }
#chat .msg .t { white-space: pre-wrap; overflow-wrap: anywhere; }
#chat .replies { margin-left: 10px; border-left: 2px solid var(--line); }
#chat .rep { font-size: 12px; color: var(--accent); cursor: pointer; padding: 3px 9px 6px; }
#chat .seen { font-size: 11px; color: var(--dim); }
#chat textarea { font: inherit; font-size: 13px; width: 100%; box-sizing: border-box; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); resize: vertical; min-height: 2.4em; }
#chat .compose { padding: 8px 10px; border-top: 1px solid var(--line); }
#chat .thr .compose { border-top: 1px solid var(--line); padding: 6px 9px; }
#chat .hint { font-size: 11px; color: var(--dim); margin-top: 3px; display: flex; justify-content: space-between; gap: 6px; }
/* overview */
.ovgrid { display: grid; grid-template-columns: minmax(340px, 1fr) minmax(0, 2fr); gap: 12px; align-items: start; }
.ovgrid > .col > .card:last-child { margin-bottom: 0; }
.ovgrid .wide { grid-column: 1 / -1; }
.recent td { padding: 3px 6px; } .recent tr { cursor: pointer; } .recent tr:hover td { background: var(--chip); }
.call.flash { outline: 2px solid var(--accent); outline-offset: 2px; }
.recent .t { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.recent .x { max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; }
/* reviews */
.gantt { display: grid; grid-template-columns: 72px minmax(0, 1fr) 150px; gap: 3px 8px; align-items: center; font-size: 12px; }
.gantt .lane { position: relative; height: 14px; background: var(--chip); border-radius: 3px; }
.gantt .lane i { position: absolute; top: 3px; height: 8px; border-radius: 4px; opacity: .55; }
.gantt .lane b { position: absolute; top: 1px; width: 2px; height: 12px; border-radius: 1px; }
.gantt .axis { grid-column: 2; display: flex; justify-content: space-between; color: var(--dim); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--dim); margin: 2px 0 6px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c); }
canvas.chart.tall { height: 170px; }
.revgrid { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 1150px) { .revgrid { grid-template-columns: 1fr; } .revgrid .rounds { max-height: 240px; overflow: auto; } }
.rounds .rd { padding: 7px 9px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.rounds .rd:hover { background: var(--chip); } .rounds .rd.on { background: var(--sel); border-color: var(--line); }
.rounds .rd .s { color: var(--dim); font-size: 12px; }
.finding { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; margin: 14px 0; }
.finding.open { border-left-color: var(--act); } .finding.new { border-left-color: var(--accent); }
.finding h3 { font-size: 14px; margin: 0 0 4px; }
.finding .ans { background: var(--bg); border-radius: 6px; padding: 6px 10px; margin-top: 6px; }
.finding .ans b { color: var(--ok); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.diff .a { color: var(--ok); } .diff .r { color: var(--act); } .diff .h { color: var(--accent); }
.report { border-left: 3px solid var(--violet); padding-left: 12px; }

/* recordings */
.recs { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 900px) { .recs { grid-template-columns: minmax(0, 1fr); } }
.reclist { max-height: calc(100vh - var(--hd) - 24px); overflow: auto; position: sticky; top: calc(var(--hd) + 12px); }
.reclist .sc { font-weight: 600; margin: 8px 0 2px; font-size: 13px; }
.reclist .r { padding: 2px 8px; border-radius: 5px; cursor: pointer; display: flex; gap: 6px; align-items: center; font-size: 13px; }
.reclist .r:hover { background: var(--chip); } .reclist .r.on { background: var(--sel); }
.mark { width: 14px; text-align: center; font-size: 12px; }
.mark.pass { color: var(--ok); } .mark.fail { color: var(--act); } .mark.none { color: var(--dim); }
.viewer-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (max-width: 1100px) { .viewer-top { grid-template-columns: minmax(0, 1fr); } }
.screen { background: #000; width: 512px; max-width: 100%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; border-radius: 6px; overflow: hidden; position: relative; }
.screen img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
.screen img:not([src]) { visibility: hidden; }
.screen .msg { color: #aaa; position: absolute; font-size: 13px; padding: 12px; text-align: center; }
.screens { display: flex; gap: 10px; flex-wrap: wrap; }
.screens .screen { width: 448px; }
.screens .slab { font-size: 12px; color: var(--dim); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; min-height: 24px; }
.screens .slab select { font-size: 12px; }
.screen canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; position: absolute; inset: 0; }
.screen canvas[hidden] { display: none; }
.screen .msg button { margin-top: 8px; }
.controls { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
.controls input[type=range] { flex: 1; min-width: 160px; }
button.b { font: inherit; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.b:hover { background: var(--chip); }
.padline { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.plots .q { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 8px; border-top: 1px solid var(--line); padding: 4px 0; }
.plots .q .lab { font-size: 13px; overflow: hidden; }
.plots .q .lab .nm { font-family: var(--mono); font-size: 12px; font-weight: 600; word-break: break-all; }
.plots .q .lab .v { font-variant-numeric: tabular-nums; font-size: 12px; }
.plots .q .lab .v .p { color: var(--port); } .plots .q .lab .v .r { color: var(--accent); }
.plots .q.diff .lab .nm { color: var(--act); }
.plots .pl { position: relative; }
.plots canvas { width: 100%; height: 64px; display: block; cursor: crosshair; }
.plots .cur { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); opacity: .8; pointer-events: none; }
.legend { font-size: 12px; color: var(--dim); display: flex; gap: 14px; margin: 4px 0; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
.warnbox { border-left: 3px solid var(--warn); padding: 4px 10px; margin: 6px 0; font-size: 13px; }
.empty { color: var(--dim); padding: 20px 0; }
/* play requests */
.req { border-left: 3px solid var(--act); }
.req.playing { border-left-color: var(--accent); }
.req.answered { border-left-color: var(--line); }
.req .what { white-space: pre-wrap; font-size: 15px; margin: 6px 0; }
.req .meta { color: var(--dim); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.req .after { border-left: 3px solid var(--warn); padding: 2px 8px; margin: 6px 0; font-size: 13px; }
.req .acts { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; margin-top: 8px; }
.req textarea { font: inherit; flex: 1; min-width: 240px; min-height: 2.4em; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
button.b.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.b:disabled { opacity: .5; cursor: default; }
div.err:not(.call) { color: var(--act); font-size: 13px; }
/* browser play */
.player { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; }
@media (max-width: 1000px) { .player { grid-template-columns: minmax(0, 1fr); } }
/* As wide as the column allows, but never taller than the window leaves
   under the header and the two lines below it. */
.player canvas { width: min(100%, calc((100vh - var(--hd) - 120px) * 4 / 3)); margin: 0 auto; aspect-ratio: 4 / 3; background: #000; image-rendering: pixelated; border-radius: 6px; display: block; outline: none; }
.player canvas:focus { box-shadow: 0 0 0 2px var(--accent); }
.player .side { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.player .row { display: flex; gap: 6px; flex-wrap: wrap; }
.player textarea, .player input[type=text] { font: inherit; width: 100%; box-sizing: border-box; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
.player textarea { min-height: 4em; }
.player .msg { border-left: 3px solid var(--accent); padding: 2px 8px; min-height: 1.4em; }
.player .msg:empty { visibility: hidden; }
.player .keys { font-family: var(--mono); font-size: 11px; color: var(--dim); display: grid; grid-template-columns: auto 1fr 1fr; gap: 0 8px; }
.player button.b.on { background: var(--sel); }
/* The note before handing back: the game waits under it. */
.player .handback { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--accent); border-radius: 8px; padding: 8px; background: var(--sel); }
.player .handback textarea { min-height: 7em; }
.player .pmarks { display: flex; flex-wrap: wrap; gap: 4px; }
.player .pmark { background: var(--chip); border-radius: 10px; padding: 1px 4px 1px 8px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.player .pmark button { border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 11px; padding: 0 3px; border-radius: 6px; }
.player .pmark button:hover { color: var(--act); background: var(--panel); }
.player.waiting canvas { opacity: .55; }
/* Gamepad setup */
#padsetup { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; }
#padsetup .card { width: min(440px, calc(100vw - 32px)); }
#padsetup .ask { font-size: 20px; margin: 14px 0 6px; }
#padsetup .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
/* Code view */
.meter { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin-top: 10px; gap: 2px; }
.meter i { display: block; height: 100%; }
tr.crow { cursor: pointer; } tr.crow:hover, tr.crow.on { background: var(--chip); }
/* Play now: a play of the person's own. */
.playnow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; max-width: 720px; }
.playnow select, .playnow input[type=text] { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 100%; box-sizing: border-box; }
.playnow label { color: var(--dim); font-size: 13px; }
.playnow .adj { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.playnow .adj label { color: var(--ink); cursor: help; }
</style>
</head>
<body>
<header>
  <h1>psx</h1>
  <span id="live">connecting…</span>
  <select id="theme" title="theme"><option value="">system theme</option><option value="light">light</option><option value="dark">dark</option><option value="ps">PlayStation</option></select>
</header>
<div id="shell">
<aside id="side"></aside>
<main id="main"><div class="empty">Loading…</div></main>
<div id="chat" class="min" hidden><div class="hd"><b>Messages</b><span class="n"></span><span class="quiet" id="chatwho"></span><span class="arr"></span></div><div class="body"></div><div class="compose"><textarea id="chatnew" placeholder="A message to the agent"></textarea><div class="hint"><span>Enter sends · Shift+Enter, a new line</span><span>it reads it with its next psx call</span></div></div></div>
</div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const api = async path => { const r = await fetch(path, {headers: {"X-PSX-Token": TOKEN}}); return r.json(); };
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmtTime = t => new Date(t).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const fmtDate = t => new Date(t).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
const fmtMs = ms => ms == null ? "" : ms < 1000 ? ms + " ms" : ms < 60000 ? (ms / 1000).toFixed(1) + " s" : Math.round(ms / 60000) + " min";
const fmtBytes = b => b == null ? "" : b < 1024 ? b + " B" : b < 1048576 ? Math.round(b / 1024) + " KB" : (b / 1048576).toFixed(1) + " MB";
const ago = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + " min" : m < 2880 ? Math.round(m / 60) + " h" : Math.round(m / 1440) + " days"; };
const LEVEL = {act: 3, warn: 2, info: 1};
// Sent with every action: only the page this server gave out can act.
const TOKEN = "__PSX_TOKEN__";
const post = async (path, body) => {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-PSX-Token": TOKEN}, body: JSON.stringify(body || {})});
  try { return await r.json(); } catch (e) { return {error: {message: r.status + " " + r.statusText}}; }
};

const S = {
  projects: [], cur: 0, view: "overview", overview: {}, calls: {},
  sel: null, errorsOnly: false, filter: "", open: {},
  recs: null, rec: null, recKey: null, tick: 0, playing: null, replay: null, port: null, portAuto: false, portMode: "side",
  requests: null, seenRequests: null, drafts: {},
  // The request being played in this page: {p, id, status, ...}.
  player: null,
};

// ------------------------------------------------------------ shell
async function start() {
  S.projects = await api("/api/projects");
  try { const h = JSON.parse(localStorage.getItem("psx-web") || "{}"); if (h.cur < S.projects.length) S.cur = h.cur; if (h.view) S.view = h.view === "calls" ? "log" : h.view; } catch (e) {}
  // A link: #/PROJECT/VIEW, or #/PROJECT/recordings/SCENARIO/NAME/TICK.
  const [i, view, scenario, name, tick] = location.hash.slice(2).split("/").map(decodeURIComponent);
  if (i === "requests") S.view = "requests";
  else if (+i < S.projects.length && ["overview", "log", "calls", "recordings", "reviews", "stats", "code"].includes(view)) {
    S.cur = +i; S.view = view === "calls" ? "log" : view;
    if (view === "recordings" && name) { S.rec = {scenario, name}; S.tick = +tick || 0; }
  }
  if (!S.projects.length) { $("#main").innerHTML = `<div class="empty">No projects yet. Run <span class="mono">psx web &lt;ROOT&gt;</span> with a project's root; it is remembered.</div>`; }
  tabs();
  initChat();
  initTheme();
  await Promise.all([...S.projects.map((_, i) => loadOverview(i)), ...S.projects.map((_, i) => loadMessages(i)), loadRequests()]);
  tabs();
  render();
  listen();
  setInterval(tabs, 60000);
  setInterval(liveScreens, 250);
}
function initTheme() {
  const sel = $("#theme");
  sel.value = document.documentElement.dataset.theme || "";
  sel.onchange = () => {
    const t = sel.value;
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    try { t ? localStorage.setItem("psx-theme", t) : localStorage.removeItem("psx-theme"); } catch (e) {}
    // Charts take their colours when drawn.
    render();
  };
}
function save() { try { localStorage.setItem("psx-web", JSON.stringify({cur: S.cur, view: S.view})); } catch (e) {} link(); }
function link() {
  if (S.view === "requests") { history.replaceState(null, "", "#/requests"); return; }
  const r = S.view === "recordings" && S.rec && S.recKey ? [S.rec.scenario, S.rec.name, S.tick] : [];
  history.replaceState(null, "", "#/" + [S.cur, S.view, ...r].map(x => encodeURIComponent(x)).join("/"));
}

function worst(i) {
  const a = S.overview[i]?.attention || [];
  return a.reduce((w, x) => LEVEL[x.level] > (LEVEL[w] || 0) ? x.level : w, "");
}
// The projects, each with its next item and what needs the person, and
// the play requests across them.
function tabs() {
  const queued = (S.requests?.waiting || []).filter(r => r.state === "queued").length;
  const proj = (p, i) => {
    const o = S.overview[i] || {}, n = o.status?.next;
    const att = (o.attention || []).filter(a => a.level !== "info").sort((a, b) => LEVEL[b.level] - LEVEL[a.level]);
    const mail = S.msgs[i]?.unread && !(i === S.cur && S.chatOpen) ? `<span class="mail" title="unread messages from the agent">✉ ${S.msgs[i].unread}</span>` : "";
    return `<div class="proj ${i === S.cur && S.view !== "requests" ? "on" : ""}" data-i="${i}" title="${esc(p.root)}">
      <div class="pn"><span class="dot ${worst(i)}"></span><b>${esc(p.name)}</b>${mail}</div>
      ${n?.item ? `<div class="pi">next: ${esc(n.item)}${n.feature ? " " + esc(n.feature) : ""}${n.who === "person" ? " · yours" : ""}</div>` : ""}
      ${att.map(a => `<div class="pa ${a.level}" data-v="${esc(a.view || "overview")}" title="${esc(a.detail)}">${esc(a.title)}</div>`).join("")}</div>`;
  };
  $("#side").innerHTML = `<button class="proj ${S.view === "requests" ? "on" : ""}" id="reqtab" title="play the game, and the agents' play requests across projects"><div class="pn"><b>Play</b><span class="n">${queued || ""}</span></div></button>
    <div class="sh">Projects</div>${S.projects.map(proj).join("")}`;
  $("#reqtab").onclick = () => { S.view = "requests"; save(); tabs(); render(); };
  for (const b of document.querySelectorAll("#side .proj[data-i]")) b.onclick = ev => {
    const i = +b.dataset.i, v = ev.target.closest(".pa")?.dataset.v;
    if (i !== S.cur) { S.sel = null; S.rec = null; S.recKey = null; }
    S.cur = i;
    if (v) S.view = v; else if (S.view === "requests") S.view = "overview";
    save(); tabs(); render();
  };
}

function listen() {
  const es = new EventSource("/api/events");
  es.onopen = () => $("#live").textContent = "live";
  es.onerror = () => $("#live").textContent = "reconnecting…";
  es.addEventListener("change", async ev => {
    const {p, what} = JSON.parse(ev.data);
    $("#live").textContent = "live · " + fmtTime(Date.now());
    await loadOverview(p);
    if (what.includes("plays")) { await loadRequests(); if (S.view === "requests" && !S.player && document.activeElement?.tagName !== "TEXTAREA") requestsView(); }
    if (what.includes("calls") && S.calls[p]) await loadCalls(p);
    if (what.includes("messages") || what.includes("messages_seen")) {
      const before = S.msgs[p]; await loadMessages(p); notifyMessages(p, before);
      if (p === S.cur) chatView();
      if (!what.some(w => !w.startsWith("messages"))) { tabs(); return; }
    }
    if (what.includes("check") && p === S.cur) { S.recs = null; if (S.rec) S.recKey = null; }
    tabs();
    if (p === S.cur && S.view !== "requests") render(true);
  });
}

async function loadOverview(i) { S.overview[i] = await api(`/api/p/${i}/overview`); }

function render(refresh) {
  if (!S.projects.length) return;
  const m = $("#main");
  if (S.view !== "requests" && S.player) stopPlayer();
  if (S.view === "requests") { chatView(); m.innerHTML = `<div id="view"></div>`; S.player ? playerView() : requestsView(); return; }
  const views = [["overview", "Overview"], ["log", "Log"], ["recordings", "Recordings"], ["reviews", "Reviews"], ["code", "Code"], ["stats", "Stats"]];
  if (!refresh || !$("nav.sub", m)) {
    m.innerHTML = `<nav class="sub">${views.map(([k, l]) => `<button class="tab ${k === S.view ? "on" : ""}" data-v="${k}">${l}</button>`).join("")}</nav><div id="view"></div>`;
    for (const b of m.querySelectorAll("nav.sub .tab")) b.onclick = () => { S.view = b.dataset.v; save(); render(); };
  }
  chatView();
  if (S.view !== "log") S.feed = null;
  document.body.classList.toggle("logv", S.view === "log");
  if (S.view === "overview") overview();
  else if (S.view === "log") logView();
  else if (S.view === "reviews") reviewsView(refresh);
  else if (S.view === "stats") statsView(refresh);
  else if (S.view === "code") codeView(refresh);
  else recordingsView(refresh);
}

// ------------------------------------------------------------ overview
function overview() {
  const o = S.overview[S.cur] || {};
  const st = o.status;
  const recent = `<div class="card"><h2>Recent calls</h2><div id="recent"><div class="quiet">Loading…</div></div></div>`;
  let h = "";
  if (!o.port) {
    h += `<div class="ovgrid"><div class="col"><div class="card"><h2>Project</h2>Not a port (no goal.toml): its calls show under Log.</div><div class="card"><h2>Attention</h2>${attentionList(o)}</div></div><div class="col">${recent}</div></div>`;
  } else if (st?.error) {
    h += `<div class="ovgrid"><div class="col"><div class="card"><h2>Status</h2><div class="att act">${esc(st.error.message)}</div></div></div><div class="col">${recent}</div></div>`;
  } else if (st) {
    const n = st.next || {};
    const next = `<div class="card next"><h2>Next</h2>
      <div><span class="item">${esc(n.item)}${n.feature ? " " + esc(n.feature) : ""}</span><span class="who ${n.who === "person" ? "person" : ""}">${esc(n.who)}</span></div>
      <div style="margin-top:6px">${esc(n.why)}</div>
      ${n.how ? `<details><summary>how</summary><div style="margin-top:4px">${esc(n.how)}</div></details>` : ""}
      ${n.done_when ? `<details><summary>done when</summary><div style="margin-top:4px">${esc(n.done_when)}</div></details>` : ""}
      ${st.guard && st.guard.item.trim() === `${n.item} ${n.feature || ""}`.trim() ? `<div class="quiet" style="margin-top:6px">port next gave “${esc(st.guard.item.trim())}” ${st.guard.count}× in a row (Stuck at ${st.guard.limit})</div>` : ""}
    </div>`;
    h += `<div class="ovgrid"><div class="col">${next}<div class="card"><h2>Attention</h2>${attentionList(o)}</div></div>
      <div class="col">${progressCard(o, st)}${recent}</div><div class="wide">${featuresCard(st)}</div></div>`;
  }
  $("#view").innerHTML = h;
  drawProgress(o);
  recentCalls();
}
// The project's last calls, each a link to its card in the log.
async function recentCalls() {
  const i = S.cur;
  if (!S.calls[i]) await loadCalls(i);
  const box = $("#recent");
  if (!box || i !== S.cur) return;
  const c = S.calls[i], xs = c.order.slice(-10).reverse().map(id => c.byId.get(id));
  box.innerHTML = xs.length ? `<table class="recent">${xs.map(x => `<tr data-id="${esc(x.id)}"><td class="t">${fmtTime(x.t)}</td><td>${x.ended == null ? pill("running", "") : x.exit ? pill("failed", "bad") : ""}</td><td style="white-space:nowrap">${esc(TOOLS[x.tool] || x.tool)}</td><td class="x" title="${esc(argsText(x))}">${esc(unroot(title(x)))}</td></tr>`).join("")}</table>`
    : `<div class="quiet">No calls logged yet.</div>`;
  for (const tr of box.querySelectorAll("tr")) tr.onclick = () => { S.view = "log"; S.jumpTo = tr.dataset.id; save(); render(); };
}
function attentionList(o) {
  const a = o.attention || [];
  const last = o.last_call ? `<div class="quiet" style="margin-top:6px">last call ${ago(o.now - o.last_call)} ago${o.last_commit ? ` · last commit ${ago(o.now - o.last_commit)} ago` : ""}</div>` : "";
  return (a.length ? a.map(x => `<div class="att ${x.level}"><div>${esc(x.title)}</div><div class="d">${esc(x.detail)}</div></div>`).join("") : `<div class="quiet">Nothing needs you.</div>`) + last;
}
function featuresOf(st) { return Object.entries(st.areas || {}).flatMap(([area, fs]) => fs.map(f => ({...f, area}))); }
function progressCard(o, st) {
  const fs = featuresOf(st).filter(f => f.in_goal);
  const sum = k => fs.reduce((s, f) => s + (f[k]?.pass ?? f[k]?.resolved ?? 0), 0);
  const tot = k => fs.reduce((s, f) => s + (f[k]?.total ?? 0), 0);
  const stages = Object.entries(st.stages || {}).map(([k, v]) => `${v} ${k}`).join(" · ");
  const tiles = [
    [fs.length, "goal features", stages],
    [`${sum("work")}/${tot("work")}`, "work recordings pass"],
    [`${sum("branches")}/${tot("branches")}`, "branches resolved"],
    [(st.problems || []).length, "problems"],
    [st.review?.state ?? "–", "review"],
  ];
  const p = o.progress || [];
  return `<div class="card"><h2>Progress</h2><div class="tiles">${tiles.map(([n, l, t]) => `<div class="tile" title="${esc(t || "")}"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>
    ${p.length > 1 ? `<div class="grid2"><div><div class="quiet">work recordings passing, of all</div><canvas class="chart" id="ch-rec"></canvas></div><div><div class="quiet">branches resolved, of all</div><canvas class="chart" id="ch-br"></canvas></div></div>
    <div class="quiet" style="margin-top:4px">${p.length} changes since ${fmtDate(p[0].t)} · each line is a port status or port next that saw the standing change</div>`
    : `<div class="quiet">History builds up as port status and port next see the standing change.</div>`}</div>`;
}
function featuresCard(st) {
  const fs = featuresOf(st);
  const row = f => {
    const w = f.work || {}, b = f.branches || {};
    const pct = (a, t) => t ? Math.round(100 * a / t) : 0;
    return `<tr><td class="mono">${esc(f.id)}</td><td>${esc(f.title)}${f.in_goal ? "" : ' <span class="quiet">(not in goal)</span>'}</td><td>${esc(f.stage)}</td><td>${esc(f.verdict)}</td>
      <td class="num">${w.pass ?? "–"}/${w.total ?? 0}</td><td><div class="bar"><i style="width:${pct(b.resolved, b.total)}%"></i></div></td><td class="num">${b.resolved ?? 0}/${b.total ?? 0}</td>
      <td class="num">${(f.questions || []).length || ""}</td></tr>`;
  };
  return `<div class="card"><h2>Features</h2><table><tr><th>id</th><th>title</th><th>stage</th><th>verdict</th><th class="num">work</th><th colspan="2">branches</th><th class="num">questions</th></tr>${fs.map(row).join("")}</table></div>`;
}
function drawProgress(o) {
  const p = o.progress || [];
  if (p.length < 2) return;

  if (!S.projects.length || S.view === "requests") { box.hidden = true; return; }
  const m = S.msgs[S.cur];
  box.hidden = false;
  box.classList.toggle("min", !S.chatOpen);
  $(".arr", box).textContent = S.chatOpen ? "▸" : "◂";
  $(".hd", box).title = S.chatOpen ? "fold the messages away" : "open the messages";
  $("#chatwho").textContent = S.projects[S.cur]?.name || "";
  if (!m) { loadMessages(S.cur).then(() => chatView()); return; }
  const unread = S.chatOpen && document.visibilityState === "visible" ? 0 : m.unread;
  $(".hd .n", box).textContent = unread || "";
  if (!S.chatOpen) return;
  const msgs = m.messages || [];
  // Which index each message has, for "seen".
  const at = new Map(msgs.map((x, k) => [x.id, k]));
  const one = x => {
    const k = at.get(x.id), mine = x.from === "person";
    const seen = mine ? (k < m.agent_seen ? `<span class="seen" title="it came with the result of one of its psx calls">✓ seen by the agent</span>` : `<span class="seen">arrives with its next psx call</span>`) : "";
    return `<div class="msg ${mine ? "" : "agent"} ${!mine && k >= S.chatSeen ? "new" : ""}"><div class="w"><b>${mine ? "you" : "agent"}</b><span>${fmtDate(x.t)}</span>${seen}</div><div class="t">${esc(x.text)}</div></div>`;
  };
  const starts = msgs.filter(x => !x.thread);
  const body = $(".body", box);
  const stick = body.scrollTop + body.clientHeight >= body.scrollHeight - 30;
  const draft = S.replying ? document.getElementById("chatrep")?.value || "" : "";
  body.innerHTML = starts.length ? starts.map(s => {
    const reps = msgs.filter(x => x.thread === s.id);
    return `<div class="thr">${one(s)}${reps.length ? `<div class="replies">${reps.map(one).join("")}</div>` : ""}
      ${S.replying === s.id ? `<div class="compose"><textarea id="chatrep" placeholder="Reply in this thread"></textarea></div>` : `<div class="rep" data-r="${esc(s.id)}">reply</div>`}</div>`;
  }).join("") : `<div class="quiet">No messages yet. Write to the agent below: it reads it with the result of its next psx call and answers when it has something to say.</div>`;
  for (const r of body.querySelectorAll(".rep")) r.onclick = () => { S.replying = r.dataset.r; chatView(); $("#chatrep")?.focus(); };
  const rep = $("#chatrep");
  if (rep) { rep.value = draft; rep.onkeydown = ev => chatKey(ev, rep, S.replying); }
  if (stick || S.chatJump) { body.scrollTop = body.scrollHeight; S.chatJump = false; }
  markRead();
}
function markRead() {
  const m = S.msgs[S.cur];
  if (!m || !S.chatOpen || document.visibilityState !== "visible") return;
  S.chatSeen = m.person_seen;
  const n = (m.messages || []).length;
  if (n > m.person_seen) { m.person_seen = n; m.unread = 0; post(`/api/p/${S.cur}/messages/seen`, {n}); }
}
function chatKey(ev, ta, replyTo) {
  if (ev.key !== "Enter" || ev.shiftKey || ev.isComposing) return;
  ev.preventDefault();
  const text = ta.value.trim(); if (!text) return;
  const p = S.cur;
  ta.disabled = true;
  post(`/api/p/${p}/messages/send`, {text, reply_to: replyTo || null}).then(async r => {
    ta.disabled = false;
    if (r.error) { ta.title = r.error.message || String(r.error); ta.style.borderColor = "var(--act)"; return; }
    ta.value = ""; ta.style.borderColor = ""; if (replyTo) S.replying = null;
    S.chatJump = true; await loadMessages(p); if (p === S.cur) chatView();
  });
}
function initChat() {
  $("#chat .hd").onclick = () => { S.chatOpen = !S.chatOpen; try { localStorage.setItem("psx-chat", S.chatOpen ? "open" : "min"); } catch (e) {} S.chatJump = true; chatView(); tabs(); if (S.chatOpen) { $("#chatnew").focus(); if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } };
  $("#chatnew").onkeydown = ev => chatKey(ev, ev.target, null);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") chatView(); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.replying && ev.target.id === "chatrep") { S.replying = null; chatView(); } });
}
// A new message from an agent: a count on the tab, and a notification when
// the page is out of sight.
function notifyMessages(p, before) {
  const m = S.msgs[p]; if (!m || !before) return;
  const fresh = (m.messages || []).slice(before.messages.length).filter(x => x.from === "agent");
  if (!fresh.length || (document.visibilityState === "visible" && p === S.cur && S.chatOpen)) return;
  if ("Notification" in window && Notification.permission === "granted")
    new Notification(`${S.projects[p]?.name}: the agent wrote`, {body: fresh[fresh.length - 1].text.slice(0, 200), tag: "psx-msg-" + p});
}

// ------------------------------------------------------------ play requests
async function loadRequests() {
  S.requests = await api("/api/requests");
  // New requests since the page last looked: a notification, when allowed.
  const ids = new Set(S.requests.waiting.map(r => r.p + "/" + r.id));
  if (S.seenRequests && "Notification" in window && Notification.permission === "granted") {
    for (const r of S.requests.waiting) if (!S.seenRequests.has(r.p + "/" + r.id) && r.state === "queued") {
      const n = new Notification(`psx · ${r.project}: a play request`, {body: r.request, tag: r.p + "/" + r.id});
      n.onclick = () => { window.focus(); S.view = "requests"; save(); tabs(); render(); };
    }

}
let requestPoll = null;
function requestsView() {
  const R = S.requests;
  if (!R) { $("#view").innerHTML = `<div class="empty">Loading…</div>`; return; }
  // A draft note survives the list being drawn again.
  for (const t of document.querySelectorAll(".req textarea")) S.drafts[t.dataset.k] = t.value;
  const win = R.window || {};
  const card = r => {
    const k = r.p + "/" + r.id;
    const rec = r.scenario ? `${r.scenario}/${r.name}` : "";
    const meta = [`<b>${esc(r.project)}</b>`, rec && `recording ${esc(rec)}${r.from ? " from the end of " + esc(r.from) : ""}`, `asked ${ago(Date.now() - r.queued_unix_ms)} ago`,
      r.state === "playing" ? `<span style="color:var(--accent)">being played${r.live?.run_frame != null ? ` · field ${r.live.run_frame}` : ""}</span>` : "",
      `<span class="mono">${esc(r.id)}</span>`].filter(Boolean).join(" · ");
    const after = r.after?.note ? `<div class="after">Asked again after you declined: ${esc(r.after.note)}</div>` : "";
    const expect = (r.expect || []).length ? `<div class="quiet">expects: <span class="mono">${(r.expect).map(esc).join(", ")}</span></div>` : "";
    let acts = "";
    if (r.state === "queued") {

        <button class="b" data-act="window" data-k="${esc(k)}" ${win.available ? "" : "disabled"} title="${esc(win.available ? "opens the native window on this machine (with sound)" : win.reason || "")}">Open in window</button>
        <textarea data-k="${esc(k)}" placeholder="Why not, for the agent: what is wrong with the request, or what to ask instead">${esc(S.drafts[k] || "")}</textarea>
        <button class="b" data-act="decline" data-k="${esc(k)}">Decline with note</button></div><div class="err" id="err-${esc(k)}"></div>`;
    }

      acts = `<div class="acts"><button class="b primary" data-act="play" data-k="${esc(k)}">Resume here</button></div><div class="err" id="err-${esc(k)}"></div>`;
    }

      acts = `<div class="meta" style="margin-top:6px">${what}${a.note ? ` · note: ${esc(a.note)}` : ""} · ${r.read ? "the agent has read it" : "the agent has not read it yet"}</div>`;

  };

    ? `<button class="b" id="notify">Notify me of new requests</button>` : "";
  $("#view").innerHTML = `${playNowCard()}<div class="filters"><span class="quiet">The agents' play requests across ${S.projects.length === 1 ? "the project" : "the projects"}, oldest first. Answer here, or in a terminal with <span class="mono">psx play</span>.</span>${notify}</div>
    ${!win.available ? `<div class="warnbox">The window cannot open here: ${esc(win.reason || "")}</div>` : ""}
    ${R.waiting.length ? R.waiting.map(card).join("") : `<div class="card quiet">No play requests wait.</div>`}
    ${R.answered.length ? `<h2 class="quiet" style="font-size:13px;margin:18px 0 8px">Answered</h2>` + R.answered.map(card).join("") : ""}`;
  if ($("#notify")) $("#notify").onclick = async () => { await Notification.requestPermission(); requestsView(); };
  playNowWire();
  for (const t of document.querySelectorAll(".req textarea")) t.oninput = () => S.drafts[t.dataset.k] = t.value;
  for (const b of document.querySelectorAll(".req button[data-act]")) b.onclick = async () => {
    const [p, id] = b.dataset.k.split("/");
    const body = b.dataset.act === "decline" ? {note: (S.drafts[b.dataset.k] || "").trim()} : {};
    if (b.dataset.act === "decline" && !body.note) { $(`#err-${CSS.escape(b.dataset.k)}`).textContent = "Write a note first: it is what the agent gets."; return; }
    b.disabled = true;
    const r = await post(`/api/p/${p}/request/${encodeURIComponent(id)}/${b.dataset.act}`, body);
    if (r.error) { b.disabled = false; $(`#err-${CSS.escape(b.dataset.k)}`).textContent = r.error.message; return; }
    if (b.dataset.act === "play") { startPlayer(+p, id); return; }
    if (b.dataset.act === "decline") delete S.drafts[b.dataset.k];

  const poll = () => requestPoll = setTimeout(async () => {
    if (S.view !== "requests" || S.player) return;
    if (document.activeElement?.tagName === "TEXTAREA" || document.activeElement?.closest?.(".playnow")) { poll(); return; }
    await loadRequests(); tabs(); requestsView();
  }, 3000);
  if (R.waiting.some(r => r.state === "playing")) poll();
}

// ------------------------------------------------------------ play now
// A play of the person's own, at any time: from a scenario's state (or the
// end of one of its recordings) it becomes a recording of that scenario, as
// an agent's request would; with no scenario it starts at power-on and its
// run keeps the end state and the input.
const stamp = () => { const d = new Date(), z = n => String(n).padStart(2, "0"); return `play-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`; };
function playNowCard() {

  // are made); one from power-on has none unless checked (no recording).

  const sc = N.scens[N.p];

    <label for="pn-s">scenario</label><select id="pn-s">${opt("", sc ? "none: from power-on, no recording" : "loading…", !N.scenario)}${list.map(x => opt(x.id, x.id, x.id === N.scenario)).join("")}</select>
    ${N.scenario ? `<label for="pn-f">start at</label><select id="pn-f">${opt("", "the scenario's state", !N.from)}${recs.map(r => opt(r.name, "the end of " + r.name, r.name === N.from)).join("")}</select>

    <label for="pn-w">what you'll do</label><input type="text" id="pn-w" value="${esc(N.what)}" placeholder="${N.scenario ? "a sentence: the recording's description, and what the agent reads" : "optional, for the agent"}">
    <span></span><div class="row" style="display:flex;gap:8px;align-items:center"><button class="b primary" id="pn-go">Play</button><span class="quiet">${N.scenario ? `becomes ${esc(N.scenario)}/${esc(N.name || "…")}; F12 to finish, as for a request` : "F12 to finish; the run keeps the state and your input"}</span></div>
    <span></span><div class="err" id="pn-err"></div>

}
const padsNow = () => { const ps = connectedPads(); return ps.length ? ps.map(g => `${esc(g.id.replace(/\s*\(.*$/, "").slice(0, 40))} (${padKind(g)})`).join(", ") : "none seen yet (press a button on it)"; };
// A pad connecting (the browser tells once a button is pressed): the Play page says so.
addEventListener("gamepadconnected", () => { if (S.view === "requests" && !S.player && !S.padSetup && !document.activeElement?.closest?.(".playnow")) requestsView(); });
// What a scenario's play can run with (docs/master-plan.md; src/adjust.rs).
const ADJUSTMENTS = [
  ["latch", "latch", "the game's pad changes only where a tick ends: a press lands on the tick it was made in"],
  ["steady", "steady", "no tick overruns its fields: the game does not slow down where the console did"],
  ["off", "off", "the functions the scenario's [off] names return at once (systems the port does not have yet)"],
];
function adjBoxes(N) {

  const boxes = ADJUSTMENTS.filter(([k]) => N.scenario || k !== "off").map(([k, l, t]) => `<label title="${esc(t)}"><input type="checkbox" data-adj="${k}" ${adj[k] ? "checked" : ""}> ${l}</label>`).join("");
  const hint = N.scenario
    ? N.adj.latch && N.adj.steady && N.adj.off ? "as recordings are made" : !N.adj.latch && !N.adj.steady ? "the stock game's timing" : "a mix: to feel what one changes"
    : N.adjOn.latch ? "latch takes the glossary binding's tick, and lets input through where none ends (boot, menus)" : N.adjOn.steady ? "" : "the stock game";
  return boxes + `<span class="quiet">${esc(hint)}</span>`;
}
async function loadPlayNow(p) {

function playNowWire() {

  const on = (id, k, redraw) => { const e = $(id); if (e) e[e.tagName === "SELECT" ? "onchange" : "oninput"] = () => { N[k] = k === "p" ? +e.value : e.value; if (redraw) requestsView(); }; };
  for (const c of document.querySelectorAll(".playnow [data-adj]")) c.onchange = () => { (N.scenario ? N.adj : N.adjOn)[c.dataset.adj] = c.checked; requestsView(); };
  on("#pn-p", "p", true); on("#pn-s", "scenario", true); on("#pn-f", "from", false); on("#pn-n", "name", false); on("#pn-w", "what", false);

// The game runs in psx web; this page shows its frames and sends what is held.
const ACTION_LABEL = {UP: "Up", DOWN: "Down", LEFT: "Left", RIGHT: "Right", CROSS: "✕", CIRCLE: "○", SQUARE: "□", TRIANGLE: "△",
  L1: "L1", R1: "R1", L2: "L2", R2: "R2", START: "Start", SELECT: "Select", L3: "L3", R3: "R3", ANALOG: "Analog"};
// KeyboardEvent.code as the window names keys (its controls file uses these).
const KEY_NAMES = {ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right", Enter: "Enter", NumpadEnter: "NumPadEnter",
  ShiftLeft: "LeftShift", ShiftRight: "RightShift", ControlLeft: "LeftCtrl", ControlRight: "RightCtrl", AltLeft: "LeftAlt", AltRight: "RightAlt",
  Space: "Space", Backspace: "Backspace", Tab: "Tab", Escape: "Escape", Quote: "Apostrophe", Backquote: "Backquote", Backslash: "Backslash",
  Comma: "Comma", Equal: "Equal", BracketLeft: "LeftBracket", BracketRight: "RightBracket", Minus: "Minus", Period: "Period",
  Semicolon: "Semicolon", Slash: "Slash", Insert: "Insert", Delete: "Delete", Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown",
  NumpadDecimal: "NumPadDot", NumpadDivide: "NumPadSlash", NumpadMultiply: "NumPadAsterisk", NumpadSubtract: "NumPadMinus", NumpadAdd: "NumPadPlus"};
const keyName = code => /^Key[A-Z]$/.test(code) ? code.slice(3) : /^Digit\d$/.test(code) ? "Key" + code.slice(5)
  : /^Numpad\d$/.test(code) ? "NumPad" + code.slice(6) : KEY_NAMES[code] || code;
// The Gamepad API's standard mapping, as gilrs names the buttons.
const PAD_NAMES = ["South", "East", "West", "North", "LeftTrigger", "RightTrigger", "LeftTrigger2", "RightTrigger2", "Select", "Start",
  "LeftThumb", "RightThumb", "DPadUp", "DPadDown", "DPadLeft", "DPadRight", "Mode"];
// The window's keys, kept here too where the browser lets go of them.
const SHORTCUTS = {F2: "rewind", F3: "pause", F5: "quick_save", F6: "mark", F7: "quick_load", F8: "restart", F12: "done", F10: "decline"};

async function startPlayer(p, id) {
  stopPlayer();
  const P = S.player = {p, id, status: {state: "starting"}, keys: new Set(), fast: false, sent: "", busy: false, dirty: false, msgSeq: -1};
  P.base = `/api/p/${p}/request/${encodeURIComponent(id)}`;
  S.bindings = S.bindings || await api("/api/bindings");
  // Started again or stopped while the bindings loaded: this play is over.
  if (S.player !== P) return;
  playerView();
  P.abort = new AbortController();
  P.onkey = ev => playerKey(ev, P);
  addEventListener("keydown", P.onkey); addEventListener("keyup", P.onkey);
  P.onblur = () => { P.keys.clear(); P.fast = false; sendInput(P); };
  addEventListener("blur", P.onblur);
  const pads = () => { if (S.player !== P) return; pollPads(P); P.raf = requestAnimationFrame(pads); };
  P.raf = requestAnimationFrame(pads);
  try { await readStream(P); } catch (e) { if (S.player === P && !P.ended) playerStatus(P, {state: "lost", message: "The connection to psx web was lost: " + e.message}); }
  if (S.player === P && !P.ended) playerStatus(P, {state: "lost", message: "The connection to psx web closed. Resume from Requests while the play lasts (a minute)."});
}
function stopPlayer() {
  const P = S.player; if (!P) return;
  P.abort?.abort(); cancelAnimationFrame(P.raf);
  removeEventListener("keydown", P.onkey); removeEventListener("keyup", P.onkey); removeEventListener("blur", P.onblur);
  S.player = null;
}
async function readStream(P) {
  const r = await fetch(P.base + "/stream", {signal: P.abort.signal});
  if (!r.ok || !r.body) throw new Error(r.status + " " + r.statusText);
  const rd = r.body.getReader();
  let buf = new Uint8Array(1 << 20), len = 0;
  for (;;) {
    const {value, done} = await rd.read();
    if (done) return;
    if (len + value.length > buf.length) { const b = new Uint8Array(Math.max(buf.length * 2, len + value.length)); b.set(buf.subarray(0, len)); buf = b; }
    buf.set(value, len); len += value.length;
    let at = 0;
    while (len - at >= 5) {
      const n = new DataView(buf.buffer, at + 1, 4).getUint32(0, true);
      if (len - at < 5 + n) break;
      const kind = buf[at], body = buf.subarray(at + 5, at + 5 + n);
      if (kind === 70) { P.frame = body.slice(); drawPlayFrame(P, P.frame); }
      else if (kind === 83) playerStatus(P, JSON.parse(new TextDecoder().decode(body)));
      at += 5 + n;
    }
    buf.copyWithin(0, at, len); len -= at;
  }
}
function drawPlayFrame(P, b) {
  const c = $("#pscreen"); if (!c) return;
  const v = new DataView(b.buffer, b.byteOffset, 4), w = v.getUint16(0, true), h = v.getUint16(2, true);
  if (!w || !h || b.length < 4 + w * h * 4) return;
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(b.buffer, b.byteOffset + 4, w * h * 4), w, h), 0, 0);
}
function playerStatus(P, st) {
  const was = P.status.state;
  P.status = {...P.status, ...st};
  if (st.state === "ended") { P.ended = true; P.abort.abort(); loadRequests().then(() => tabs()); }
  if (st.state !== was || st.state === "ended" || st.state === "lost" || (st.message_seq ?? -1) !== P.msgSeq || st.labelling !== P.labelShown) playerView();
  else playerLine(P);
}
function playerLine(P) {
  const st = P.status, l = $("#pline"); if (!l) return;
  l.textContent = [st.state, st.mode, st.adjust ? (st.adjust.length ? "adjusted: " + st.adjust.join(", ") + (st.latch ? ` (latch: ${st.latch})` : "") : "stock game") : "", st.run_frame != null ? `field ${st.run_frame}` : "", st.quick_save ? "quick save kept" : "", P.fast ? "fast forward" : ""].filter(Boolean).join(" · ");
  const pz = $("#ppause"); if (pz) pz.classList.toggle("on", st.state === "paused");
}
function playerView() {
  const P = S.player, st = P.status, v = $("#view"); if (!v) return;
