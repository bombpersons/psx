    const cases = k && k.passed != null ? `${num(k.passed)} / ${num((k.passed || 0) + (k.failed || 0))}` : "";
    return `<tr class="crow ${on ? "on" : ""}" data-f="${esc(f.name)}"><td class="mono">${esc(f.name)}${f.names ? "" : ` <span class="quiet">helper</span>`}</td><td class="mono">${esc(f.names?.address || "")}</td>
      <td class="mono quiet">${esc(f.file)}:${f.line}</td><td>${checkPill(k)}</td><td class="num">${cases}</td><td style="white-space:nowrap">${k ? fmtDate(k.at) : ""}</td><td>${(f.off || []).map(esc).join(", ")}</td></tr>`
      + (on ? `<tr><td colspan="7">${codeDetail(f)}</td></tr>` : "");
  };
  h += `<div class="card"><h2>Functions in C</h2>${cs.length ? `<div style="overflow-x:auto"><table><tr><th>function</th><th>address</th><th>where</th><th>last check</th><th class="num">cases</th><th>when</th><th>off in</th></tr>${cs.map(row).join("")}</table></div>`
    : `<div class="quiet">No C yet: the agent writes a function's C as <span class="mono">decomp/&lt;name&gt;.c</span> and checks it with <span class="mono">code check</span>.</div>`}</div>`;
  if ((d.off || []).length) h += `<div class="card"><h2>Turned off</h2><table><tr><th>function</th><th>address</th><th>in scenarios</th></tr>${d.off.map(o => `<tr><td class="mono">${esc(o.function)}</td><td class="mono">${esc(o.names?.address || "")}</td><td>${o.scenarios.map(esc).join(", ")}</td></tr>`).join("")}</table></div>`;
  const ks = (d.checks || []).slice().reverse();
  if (ks.length) h += `<div class="card"><h2>Checks</h2><div class="scroll"><table class="recent">${ks.slice(0, 60).map(k => `<tr><td class="t">${fmtDate(k.t)}</td><td>${checkPill(k)}</td><td class="mono">${esc(k.function)}</td><td class="num">${k.passed != null ? `${num(k.passed)} / ${num((k.passed || 0) + (k.failed || 0))}` : ""}</td><td class="mono quiet">${esc((k.commit || "").slice(0, 7))}</td></tr>`).join("")}</table></div></div>`;
  $("#view").innerHTML = h;
  for (const r of $("#view").querySelectorAll(".crow")) r.onclick = () => { S.code.open = S.code.open === r.dataset.f ? null : r.dataset.f; drawCode(); };
}
function codeDetail(f) {
  const k = f.check;
  if (!k) return `<div class="quiet">Not checked yet: <span class="mono">psx code check ${esc(f.name)} --state STATE</span> runs the game from a state and compares each call with the original.</div>`;
  const ff = k.first_failure;
  return kv([["state", k.state ? mono(unroot(k.state)) : null], ["commit", k.commit ? mono(k.commit.slice(0, 10)) : null],
    ["C", k.stale ? "changed since this check: check again" : "as checked"],
    ["first failing case", ff ? `call ${num(ff.hit)}${ff.args ? ` · args ${ff.args.map(esc).join(", ")}` : ""}${ff.state ? ` · rerun from ${mono(unroot(ff.state))}` : ""}` : null],
    ["differences", ff?.differences ? `<div class="code">${ff.differences.slice(0, 20).map(x => esc(typeof x === "string" ? x : JSON.stringify(x))).join("\n")}</div>` : null],
    ["build messages", (k.messages || []).length ? `<div class="code">${k.messages.slice(0, 20).map(m => esc(typeof m === "string" ? m : `${m.file || ""}:${m.line || ""}: ${m.text || m.message || JSON.stringify(m)}`)).join("\n")}</div>` : null]]);
}

// ------------------------------------------------------------ recordings
async function recordingsView(refresh) {
  const i = S.cur;
  if (!S.recs || S.recs.i !== i) { S.recs = {i, ...(await api(`/api/p/${i}/recordings`))}; if (i !== S.cur) return; }
  const list = S.recs.scenarios.map(s => `<div class="sc">${esc(s.id)}</div>` + s.recordings.map(r => {
    const mark = !r.checked ? `<span class="mark none" title="not in the last port check">·</span>` : r.failures ? `<span class="mark fail" title="${r.failures} failures">✗</span>` : `<span class="mark pass">✓</span>`;
    const on = S.rec && S.rec.scenario === s.id && S.rec.name === r.name;
    return `<div class="r ${on ? "on" : ""}" data-s="${esc(s.id)}" data-n="${esc(r.name)}">${mark}<span>${esc(r.name)}</span></div>`;
  }).join("")).join("");
  const chk = S.recs.check?.commit ? `last port check: ${esc(String(S.recs.check.commit).slice(0, 10))}, ${esc(S.recs.check.at)}` : "no port check yet";
  if (!refresh || !$("#reclist")) {
    $("#view").innerHTML = `<div class="recs"><div class="card reclist" id="reclist"></div><div id="viewer"><div class="card quiet">Pick a recording: psx replays it on psx-core for the screen, the port draws it beside that on request, and below are the compared quantities and what the last port check said.</div></div></div>`;
  }
  $("#reclist").innerHTML = `<div class="quiet">${chk}</div>` + (list || `<div class="empty">No scenarios.</div>`);
  for (const r of document.querySelectorAll("#reclist .r")) r.onclick = () => openRec(r.dataset.s, r.dataset.n);
  if (S.rec && !S.recKey) openRec(S.rec.scenario, S.rec.name, true);
  else if (S.rec && !$("#plots")) viewer();
}
async function openRec(scenario, name, keepTick) {
  const i = S.cur, key = `${i}/${scenario}/${name}`;
  stop();
  const rec = await api(`/api/p/${i}/recording?scenario=${encodeURIComponent(scenario)}&name=${encodeURIComponent(name)}`);
  if (i !== S.cur) return;
  if (rec.error) { $("#viewer").innerHTML = `<div class="card"><div class="att act">${esc(rec.error.message)}</div></div>`; return; }
  const sameRec = S.recKey === null && S.rec && S.rec.scenario === scenario && S.rec.name === name;
  S.rec = rec; S.recKey = key; S.replay = null; S.port = null;
  if (!(keepTick && sameRec)) S.tick = firstDiff() ?? 0;
  for (const r of document.querySelectorAll("#reclist .r")) r.classList.toggle("on", r.dataset.s === scenario && r.dataset.n === name);
  viewer();
  pollReplay(key);
  pollPort(key, S.portAuto ? 1 : 0);
}
function firstDiff() {
  const f = (S.rec?.check?.failures || []).filter(x => x.tick != null).map(x => x.tick);
  return f.length ? Math.min(...f) : null;
}
function viewer() {
  const r = S.rec, n = r.ticks.length, fd = firstDiff();
  const ch = r.check;
  const checkLine = !ch ? `<div class="quiet">Not in the last port check.</div>`
    : ch.failures.length ? `<div class="warnbox">port check at ${esc(String(ch.commit).slice(0, 10))} (${esc(ch.at)}): ${ch.failures.length} difference${ch.failures.length > 1 ? "s" : ""}${fd != null ? `, the first at tick ${fd}` : ""}<br>${ch.failures.map(f => `<span class="mono">${esc(f.text)}</span>`).join("<br>")}</div>`
    : `<div class="quiet" style="color:var(--ok)">The port matched every tick at ${esc(String(ch.commit).slice(0, 10))} (${esc(ch.at)}).</div>`;
  const hasPort = r.quantities.some(q => q.port);
  $("#viewer").innerHTML = `<div class="card"><h2>${esc(r.scenario)} / ${esc(r.name)}</h2>
    <div>${esc(r.description || "")}</div><div class="quiet">${esc(r.moment || "")}${r.from ? ` · continues ${esc(r.from)}` : ""} · ${n} ticks${r.captured ? "" : " · an example, not captured"}</div>${checkLine}
    <div class="viewer-top" style="margin-top:8px"><div class="screens">
      <div><div class="slab">original · psx-core</div><div class="screen"><img id="frame" alt=""><div class="msg" id="fmsg">replaying…</div></div></div>
      <div><div class="slab">port <select id="pmode" title="how the port's screen is shown"><option value="side">its own screen</option><option value="blend">over the original</option><option value="diff">difference</option></select><button class="b" id="pagain" hidden title="draw it again with the port's code now">draw again</button></div>
        <div class="screen" id="pscreen"><img id="pframe" alt=""><canvas id="pcanvas" hidden></canvas><div class="msg" id="pmsg"></div></div></div></div>
    <div><div class="controls"><button class="b" id="play">▶</button><button class="b" id="prev" title="previous tick (←)">‹</button><button class="b" id="nextb" title="next tick (→)">›</button>
      <input type="range" id="scrub" min="0" max="${n}" value="${S.tick}">${fd != null ? `<button class="b" id="jump" style="color:var(--act)">first difference</button>` : ""}</div>
      <div id="tickinfo" class="padline"></div><div id="replaynote" class="quiet" style="margin-top:6px"></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>original (the recording)</span>${hasPort ? `<span><i style="background:var(--port)"></i>port (last check), where it is not the original</span>` : ""}${ch?.failures.length ? `<span><i style="background:var(--act)"></i>first difference</span>` : ""}</div>
      ${ch?.failures.length && !hasPort ? `<div class="quiet">The port's own values show once its scenario report keeps them (a template update): until then, where it first differed.</div>` : ""}
    </div></div></div>
    <div class="card plots" id="plots">${r.quantities.map((q, k) => `<div class="q ${(ch?.failures || []).some(f => f.quantity === q.name) ? "diff" : ""}"><div class="lab"><div class="nm" title="${esc(q.description || "")}">${esc(q.name)}</div><div class="quiet">${esc(q.type)}${q.unit ? " · " + esc(q.unit) : ""}${q.tolerance ? " · ±" + esc(q.tolerance) : ""}</div><div class="v" id="v${k}"></div></div><div class="pl"><canvas data-k="${k}"></canvas><div class="cur"></div></div></div>`).join("")}</div>`;
  $("#pmode").value = S.portMode;
  $("#pmode").onchange = e => { S.portMode = e.target.value; showPort(S.tick); };
  $("#pagain").onclick = () => pollPort(S.recKey, 1);
  $("#play").onclick = () => S.playing ? stop() : play();
  $("#prev").onclick = () => setTick(S.tick - 1);
  $("#nextb").onclick = () => setTick(S.tick + 1);
  $("#scrub").oninput = e => setTick(+e.target.value);
  if ($("#jump")) $("#jump").onclick = () => setTick(fd);
  for (const c of document.querySelectorAll("#plots canvas")) {
    const at = e => { const b = c.getBoundingClientRect(); setTick(Math.round((e.clientX - b.left) / b.width * n)); };
    // The release is listened for per drag, so redrawing adds no listeners.
    c.onmousedown = e => {
      stop(); at(e); c.onmousemove = at;
      const up = () => { c.onmousemove = null; removeEventListener("mouseup", up); };
      addEventListener("mouseup", up);
    };
  }
  drawPlots(); setTick(S.tick);
}
document.addEventListener("keydown", e => {
  if (S.view !== "recordings" || !S.rec || e.target.tagName === "INPUT" && e.target.type === "text") return;
  if (e.key === "ArrowLeft") { setTick(S.tick - (e.shiftKey ? 10 : 1)); e.preventDefault(); }
  if (e.key === "ArrowRight") { setTick(S.tick + (e.shiftKey ? 10 : 1)); e.preventDefault(); }
  if (e.key === " ") { S.playing ? stop() : play(); e.preventDefault(); }
});
function play() {
  if (S.tick >= S.rec.ticks.length) S.tick = 0;
  $("#play").textContent = "❚❚";
  S.playing = setInterval(() => { if (S.tick >= S.rec.ticks.length) stop(); else setTick(S.tick + 1); }, 1000 / 30);
}
function stop() { if (S.playing) clearInterval(S.playing); S.playing = null; const p = $("#play"); if (p) p.textContent = "▶"; }
const frameCache = new Map();
function setTick(t) {
  const r = S.rec; if (!r) return;
  t = Math.max(0, Math.min(r.ticks.length, t)); S.tick = t;
  $("#scrub").value = t;
  const row = t ? r.ticks[t - 1] : null;
  const pad = row ? (row.pad.length ? row.pad.join(" ") : "released") : "the moment the launcher builds";
  const sticks = row && row.analog ? ` · analog ${row.sticks.join(" ")}` : "";
  $("#tickinfo").textContent = t ? `tick ${t} · field ${row.field} · pad ${pad}${sticks}` : `initial · ${pad}`;
  r.quantities.forEach((q, k) => {
    const v = $("#v" + k); if (!v) return;
    const rec = q.shown[t], port = q.port_shown ? q.port_shown[t] : undefined;
    v.innerHTML = `<span class="r">${esc(fmtVal(rec))}</span>` + (port !== undefined ? ` · <span class="p">${esc(port == null ? "–" : fmtVal(port))}</span>` : "");
  });
  drawCursor();
  link();
  showFrame(Math.max(1, t));
  showPort(t);
}
function fmtVal(v) { return v == null ? "–" : typeof v === "number" ? (Number.isInteger(v) ? v : +v.toFixed(4)) : typeof v === "object" ? JSON.stringify(v) : v; }
function showFrame(t) {
  const img = $("#frame"), msg = $("#fmsg"); if (!img) return;
  const url = `/api/p/${S.cur}/frame?scenario=${encodeURIComponent(S.rec.scenario)}&name=${encodeURIComponent(S.rec.name)}&tick=${t}`;
  const have = S.replay?.frames ?? 0;
  if (S.replay && !S.replay.done && t > have) { msg.textContent = `replaying… ${have} of ${S.rec.ticks.length} ticks`; msg.style.display = ""; return; }
  img.onload = () => msg.style.display = "none";
  img.onerror = () => { img.removeAttribute("src"); if (!S.replay?.done?.error) msg.textContent = "no frame for this tick"; msg.style.display = ""; };
  img.src = url;
}
async function pollReplay(key) {
  let start = 1;
  while (S.recKey === key) {
    const r = await api(`/api/p/${S.cur}/replay?scenario=${encodeURIComponent(S.rec.scenario)}&name=${encodeURIComponent(S.rec.name)}&start=${start}`);
    start = 0;
    if (S.recKey !== key) return;
    const first = !S.replay;
    S.replay = r;
    const note = $("#replaynote");
    if (r.error) { note.textContent = r.error; return; }
    if (r.done?.error) { note.textContent = ""; const m = $("#fmsg"); m.textContent = "The replay failed: " + r.done.error.message; m.style.display = ""; return; }
    if (r.done) {
      const d = r.done.differences || [];
      note.innerHTML = d.length ? `<div class="warnbox">The replay is not the recording, so the screen may not show what was recorded:<br>${d.map(esc).join("<br>")}</div>` : "psx-core replayed the recording tick for tick.";
      if (first || $("#fmsg").style.display !== "none") showFrame(Math.max(1, S.tick));
      return;
    }
    note.textContent = `replaying on psx-core… ${r.frames} of ${S.rec.ticks.length} ticks`;
    if (Math.max(1, S.tick) <= r.frames) showFrame(Math.max(1, S.tick));
    await new Promise(res => setTimeout(res, 700));
  }
}
// The port drawing the same recording (psx_bevy::frames): built and run
// with cargo in the project on request, then kept for that code.
const portQ = () => `scenario=${encodeURIComponent(S.rec.scenario)}&name=${encodeURIComponent(S.rec.name)}`;
async function pollPort(key, start) {
  if (start) S.portAuto = true;
  while (S.recKey === key) {
    const r = await api(`/api/p/${S.cur}/port_replay?${portQ()}&start=${start}`);
    start = 0;
    if (S.recKey !== key) return;
    S.port = r;
    showPort(S.tick);
    if (!r.running) return;
    await new Promise(res => setTimeout(res, 700));
  }
}
const imgCache = new Map();
function loadImg(url) {
  let p = imgCache.get(url);
  if (!p) {
    p = new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = url; });
    p.catch(() => imgCache.delete(url));
    if (imgCache.size > 600) imgCache.delete(imgCache.keys().next().value);
    imgCache.set(url, p);
  }
  return p;
}
function showPort(t) {
  const img = $("#pframe"), cv = $("#pcanvas"), msg = $("#pmsg"); if (!img) return;
  const r = S.port, again = $("#pagain");
  again.hidden = !(r && !r.running && (r.done || r.error));
  const say = html => { msg.innerHTML = html; msg.style.display = ""; img.removeAttribute("src"); cv.hidden = true; };
  if (!r || (!r.running && !r.done && !r.error)) {
    say(`The port's game draws this recording tick by tick (its <span class="mono">--replay</span>), headless. The first time builds it with cargo.<br><button class="b" id="pdraw">Draw the port</button>`);
    $("#pdraw").onclick = () => pollPort(S.recKey, 1);
    return;
  }
  const err = r.error?.message || r.error || r.done?.error;
  if (err && !(r.frames > t)) { say(`<span style="color:var(--act)">${esc(err)}</span>`); return; }
  if (r.running && t >= r.frames) { say(esc(r.progress || "starting") + "…"); return; }
  const url = `/api/p/${S.cur}/port_frame?key=${r.key}&tick=${t}`;
  if (S.portMode === "side") {
    cv.hidden = true;
    img.onload = () => msg.style.display = "none";
    img.onerror = () => say("no frame for this tick");
    img.src = url;
    return;
  }
  // Over the original, or where the two differ, at the port's size.
  const orig = `/api/p/${S.cur}/frame?${portQ()}&tick=${Math.max(1, t)}`;
  Promise.all([loadImg(url), loadImg(orig)]).then(([a, b]) => {
    if (S.tick !== t || S.portMode === "side") return;
    const w = a.naturalWidth, h = a.naturalHeight;
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d");
    if (S.portMode === "blend") {
      ctx.globalAlpha = 1; ctx.drawImage(b, 0, 0, w, h); ctx.globalAlpha = 0.5; ctx.drawImage(a, 0, 0); ctx.globalAlpha = 1;
    } else {
      ctx.drawImage(b, 0, 0, w, h); const B = ctx.getImageData(0, 0, w, h);
      ctx.drawImage(a, 0, 0); const A = ctx.getImageData(0, 0, w, h);
      for (let i = 0; i < A.data.length; i += 4) {
        const d = (Math.abs(A.data[i] - B.data[i]) + Math.abs(A.data[i + 1] - B.data[i + 1]) + Math.abs(A.data[i + 2] - B.data[i + 2])) / 3;
        A.data[i] = d * 2; A.data[i + 1] = d * 0.6; A.data[i + 2] = 0;
      }
      ctx.putImageData(A, 0, 0);
    }
    img.removeAttribute("src"); cv.hidden = false; msg.style.display = "none";
  }, () => say(S.replay?.done ? "no frame for this tick" : "waiting for the original's screen…"));
}
function drawPlots() {
  const r = S.rec, n = r.ticks.length, fails = r.check?.failures || [];
  for (const c of document.querySelectorAll("#plots canvas")) {
    const q = r.quantities[+c.dataset.k];
    const ctx = setup(c), W = c.clientWidth, H = c.clientHeight;
    const vals = q.values.concat(q.port || []).filter(v => v != null);
    const f = fails.find(x => x.quantity === q.name);
    if (f) { if (f.expected != null) vals.push(f.expected); if (f.got != null) vals.push(f.got); }
    if (!vals.length) { ctx.fillStyle = css("--dim"); ctx.font = "12px system-ui"; ctx.fillText("not a number: its value shows on the left", 4, 20); continue; }
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (lo === hi) { lo -= 1; hi += 1; }
    const X = t => 2 + (W - 4) * t / Math.max(1, n), Y = v => H - 4 - (H - 8) * (v - lo) / (hi - lo);
    c._X = X;
    ctx.fillStyle = css("--dim"); ctx.font = "10px system-ui";
    const lab = v => q.variants ? (q.variants[v] ?? v) : +v.toFixed(3);
    ctx.fillText(lab(hi), 3, 10); ctx.fillText(lab(lo), 3, H - 3);
    // The port is drawn only where it is not the original, so the two part
    // where they differ.
    const off = t => q.port && q.port[t] != null && q.port[t] !== q.values[t];
    const line = (arr, color, w, only) => {
      ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); let pen = false;
      arr.forEach((v, t) => { if (v == null || only && !only(t) && !only(t + 1)) { pen = false; return; } const x = X(t), y = Y(v);
        if (!pen) { ctx.moveTo(x, y); pen = true; } else if (q.variants || q.type === "bool") { ctx.lineTo(x, Y(arr[t - 1])); ctx.lineTo(x, y); } else ctx.lineTo(x, y); });
      ctx.stroke(); ctx.lineWidth = 1;
    };
    line(q.values, css("--accent"), 1.5);
    if (q.port) line(q.port, css("--port"), 2, off);
    if (f && f.tick != null) {
      ctx.strokeStyle = css("--act"); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(f.tick), 0); ctx.lineTo(X(f.tick), H); ctx.stroke(); ctx.setLineDash([]);
      if (f.got != null) { ctx.fillStyle = css("--act"); ctx.beginPath(); ctx.arc(X(f.tick), Y(f.got), 3.5, 0, 7); ctx.fill(); }
    }
  }
}
// The cursor is an element over the plot, so moving it leaves the plot
// as drawn (some browsers hand canvas pixels back as noise to stop
// fingerprinting, so they are never read back).
function drawCursor() {
  for (const c of document.querySelectorAll("#plots canvas")) {
    if (c._X) c.nextElementSibling.style.left = c._X(S.tick) + "px";
  }
}
window.addEventListener("resize", () => { if ($(".feedbox")) { $(".feedbox").style.height = Math.max(240, innerHeight - $(".feedbox").getBoundingClientRect().top - 12) + "px"; keepPlace(); } if (S.view === "recordings" && S.rec && $("#plots")) { drawPlots(); drawCursor(); } else if (S.view === "overview") overview(); });
start();
</script>
