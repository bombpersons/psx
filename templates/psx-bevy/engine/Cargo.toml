# This game's engine family: reusable by a different game, so nothing here
# names this game's characters, items, assets or table ids. See AGENTS.md.
[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
dev-mcp = ["psx-bevy/dev-mcp"]

[dependencies]
psx-bevy.workspace = true
bevy.workspace = true
serde.workspace = true
ron.workspace = true
# The editor's UI crate. Unused by the engine itself: it is here so every
# build (game, editor, mods) resolves the same Bevy features and shares one
# compiled Bevy. See editor/AGENTS.md, "One Bevy build".
bevy_egui.workspace = true
# The editor's MCP server crates, unused by the engine itself and here for the
# same reason: without them the editor turns on features of crates Bevy
# shares (futures, rand, syn...) that the game doesn't, and each switch
# rebuilds most of Bevy. Every build compiles them once.
rmcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true

[[example]]
name = "sandbox"
