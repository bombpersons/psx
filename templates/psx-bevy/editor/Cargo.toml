# The editor for the engine's formats: a modern desktop application (egui),
# not a PS1 game: it depends on `engine` only, never on `game`, so it opens
# any game's or mod's files in the engine's formats. See AGENTS.md.
#
#   cargo run -p editor
#   cargo run -p editor -- game/assets/demo/level.ron
[package]
name = "editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
engine.workspace = true
bevy.workspace = true
bevy_egui.workspace = true
serde.workspace = true
ron.workspace = true
