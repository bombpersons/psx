# One workspace, one target directory, one lockfile:
#
#   psx-bevy/      the psx template's own crate. `psx template update` replaces
#                  it; extend it from engine/ or game/ instead of editing it
#   engine/        this game's engine family: no names, numbers or assets from
#                  this game
#   game/          this title: controllers, rules, HUD, menus, baked assets
#   tools/import/  offline importers: extracted disc data -> engine formats
#   mods/example/  a mod: a small game built on game/ from hand-made assets
#   vendor/        psx-media and psx-assets, vendored by the template
#   editor/        the editor for the engine's formats (egui, depends on
#                  engine/ only)
#
# Standalone: copying the template does not require the psx workspace.
[workspace]
resolver = "3"
members = ["psx-bevy", "engine", "game", "tools/import", "mods/example", "editor"]
default-members = ["game"]
# Template-owned copies of psx crates: dependencies, not members (their tests
# run in the psx repository).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
psx-bevy = { path = "psx-bevy" }
engine = { path = "engine" }
# The game as a library, for mods (crates built on it). `package` is the
# game's package name; the code calls it `game`.
game = { path = "game", package = "psx-game" }
# The importers (tools/import), a library the game runs on first start.
import = { path = "tools/import" }
bevy = { version = "=0.20.0", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_winit",
  "bevy_core_pipeline", "bevy_pbr", "bevy_sprite_render", "bevy_gltf", "bevy_gilrs",
  "png", "x11", "wayland", "bevy_ui_render", "default_font",
  # States: the game waits in GameData until its disc import is ready.
  "bevy_state",
  # Components and resources deriving `Reflect` register themselves, so the
  # developer MCP's `game_query` can read them without `register_type` calls.
  "reflect_auto_register",
] }
# Bevy 0.20 exposes native GLES on its renderer crate, not the facade features.
bevy_render = { version = "=0.20.0", default-features = false, features = ["gles"] }
# Persist physical bindings without enabling serialization on the renderer/world.
bevy_input = { version = "=0.20.0", features = ["serialize"] }
# The editor's UI. engine/ depends on it too, so the game's build turns on
# the same Bevy and font-crate features as the editor's: switching between
# `cargo run` and `cargo run -p editor` reuses one Bevy build instead of
# recompiling it (see editor/AGENTS.md, "One Bevy build").
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
# Disc images (CUE/BIN, ISO, CHD), ISO9660 and PS1 asset formats: the psx
# toolkit's crates, vendored by the template (vendor/README.md). The game
# imports from the player's disc itself (game/src/disc.rs, tools/import), so
# players need neither the toolkit nor a separate export step.
psx-media = { path = "vendor/psx-media" }
psx-assets = { path = "vendor/psx-assets" }
rmcp = { version = "=3.5.1", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["alloc"] }
# Hand-editable tables and tuning (the version Bevy already uses).
ron = "0.12"
# Feature alignment: rmcp and tokio-util enable `serde/rc`, `serde_json/alloc`,
# `futures/std`, default futures-sink and default base64 0.23, all of which
# Bevy shares. Enabling them in every build keeps the shared crates' resolved
# features identical with and without `dev-mcp`, so switching rebuilds only the
# MCP crates and the game instead of most of Bevy.
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-sink = "0.3"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }

# Iteration builds: your code at opt-level 1 (fast to rebuild), dependencies
# (Bevy) at 3, so `cargo run` plays at close to release speed. Line tables
# only keeps backtraces while cutting link time and target size.
# `cargo build --release` compiles all of Bevy again in its own profile
# (minutes, not seconds): use it for shipping and profiling, not iteration.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

