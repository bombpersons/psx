[package]
name = "psx-game"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

# Standalone: copying the template does not require the psx workspace.
[workspace]

[features]
default = []
dev-mcp = ["dep:rmcp", "dep:tokio", "dep:serde", "dep:serde_json", "dep:base64", "dep:image"]

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_winit",
  "bevy_core_pipeline", "bevy_pbr", "bevy_sprite_render", "bevy_gltf", "bevy_gilrs",
  "png", "x11", "wayland",
] }
# Bevy 0.20 exposes native GLES on its renderer crate, not the facade features.
bevy_render = { version = "=0.20.0", default-features = false, features = ["gles"] }
rmcp = { version = "=3.5.1", optional = true, features = ["transport-io"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "sync", "time", "io-std"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
