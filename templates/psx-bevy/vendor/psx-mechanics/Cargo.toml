# Owned by the psx template (`psx template update` replaces it): a copy of the
# psx toolkit's crates/psx-mechanics, the mechanic, interface and trace
# formats the step-replay harness reads. Fix bugs upstream, not here. See
# ../README.md.
[package]
name = "psx-mechanics"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Mechanic, interface, binding and trace formats: the platform-free side of porting by mechanics"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1"

[lints.rust]
unsafe_code = "forbid"
