# against. Fix bugs upstream, not here. See ../README.md.
[package]
name = "psx-capture"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "The API a mechanic's binding is written against: a plugin psx loads to read the step from the machine"
