# Owned by the psx template (`psx template update` replaces it): a copy of the
# psx toolkit's crates/psx-assets (TIM, TMD, VAB/VAG, SPU-ADPCM), for the
# importers. Fix bugs upstream, not here. See ../README.md.
[package]
name = "psx-assets"
version = "0.3.8"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "PlayStation asset formats (TIM, TMD, VAB/VAG, SPU-ADPCM): parsing, decoding and signature scanning"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
