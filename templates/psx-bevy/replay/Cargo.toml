[package]
name = "replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Step replay of the mechanics written as Rust (mechanics/<id>/): build.rs
# generates the glue between each mechanic's structs and its traces, and
# `cargo test -p replay` runs every trace through the mechanic's own step.
# Each mechanic is a dependency here, by path:
#
#   croc-turn = { path = "../mechanics/croc.turn" }
[dependencies]
psx-mechanics = { workspace = true }

[build-dependencies]
psx-mechanics = { workspace = true }
