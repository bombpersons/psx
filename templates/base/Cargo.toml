# One workspace, one target directory, one lockfile:
#
#   game/          the port: a library implementing psx_scenario::Port, and
#                  a thin binary
#   tools/import/  importers: the player's disc -> the port's formats
#   glossary/      the quantities scenarios compare; glossary/binding/, where
#                  the original keeps them, joins members once written
#                  (vendor/psx-capture's crate docs)
#   vendor/        psx-media, psx-assets, psx-fixed, psx-gte, psx-scenario and
#                  psx-capture, vendored
#
# The port adds crates (an engine, a renderer, an editor) as members when it
# needs them; `psx port add` writes ready-made ones under addons/.
#
# Standalone: copying the template does not require the psx workspace.
[workspace]
resolver = "3"
members = ["game", "tools/import", "glossary"]
default-members = ["game"]
# Template-owned copies of psx crates: dependencies, not members (their tests
# run in the psx repository).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
# The importers (tools/import).
import = { path = "tools/import" }
# Disc images (CUE/BIN, ISO, CHD), ISO9660 and PS1 asset formats: the psx
# toolkit's crates, vendored by the template, for the importers alone.
psx-media = { path = "vendor/psx-media" }
psx-assets = { path = "vendor/psx-assets" }
# Numbers for exact rules (Fixed with the original's width and rounding, or
# f32, from one generic rule) and the GTE as psx emulates it.
psx-fixed = { path = "vendor/psx-fixed" }
psx-gte = { path = "vendor/psx-gte" }
# The Port trait, the scenario runner and --replay, and the glue the game
# and the glossary's binding generate from glossary/.
psx-scenario = { path = "vendor/psx-scenario" }
# The API the glossary's binding (glossary/binding/) is written against: psx
# scenario record builds the binding and loads it.
psx-capture = { path = "vendor/psx-capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hand-editable tables and tuning.
ron = "0.12"

# Iteration builds: your code at opt-level 1, dependencies at 3. Line tables
# only keeps backtraces while cutting link time and target size.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
